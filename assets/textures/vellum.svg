<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <!-- Vellum: soft cloudy mottling plus a fine fibrous tooth -->
  <filter id="cloud" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.014" numOctaves="4" seed="11" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.38  0 0 0 0 0.33  0 0 0 0.16 -0.02"/>
  </filter>
  <filter id="tooth" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85 0.32" numOctaves="2" seed="4" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.25  0 0 0 0 0.23  0 0 0 0 0.2  0 0 0 0.11 0"/>
  </filter>
  <rect width="480" height="480" filter="url(#cloud)"/>
  <rect width="480" height="480" filter="url(#tooth)"/>
</svg>
