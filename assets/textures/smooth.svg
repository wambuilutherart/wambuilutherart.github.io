<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <!-- Smooth (Bristol-like): a barely-there fine grain -->
  <filter id="g" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="1" seed="2" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.3  0 0 0 0 0.28  0 0 0 0 0.25  0 0 0 0.06 0"/>
  </filter>
  <rect width="300" height="300" filter="url(#g)"/>
</svg>
